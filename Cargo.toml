[package]
name = "aida-runtime"
version = "0.1.0"
edition = "2024"

[dependencies]
aida-ast = { path = "../aida-ast" }
ab_glyph = "0.2.32"
bytemuck = { version = "1.25.2", features = ["derive"] }
csv = "1.4"
fontdb = "0.24"
lyon = "1.0"
pollster = "1.0.1"
rodio = { version = "0.21.1", default-features = false, features = ["playback", "symphonia-adpcm", "symphonia-mp3", "symphonia-pcm", "symphonia-wav"] }
resvg = "0.49.0"
roxmltree = "0.21"
smallvec = "1.16.4"
serde = "1.0"
serde_json = "1.0"
time = { version = "0.3", features = ["local-offset"] }
tiny-skia = "0.12"
wgpu = "30.0.1"
winit = "0.30.13"

[target.'cfg(windows)'.dependencies]
rfd = { version = "0.15", default-features = false }

[target.'cfg(unix)'.dependencies]
rfd = { version = "0.15", default-features = false, features = ["async-std", "xdg-portal"] }
